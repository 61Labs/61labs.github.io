<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>61Labs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, #1a1f33 0%, #0b0d15 60%);
            z-index: -2;
            animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 20%;
            right: 10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.06) 0%, transparent 70%);
            z-index: -1;
            animation: glowFloat 12s ease-in-out infinite alternate;
        }

        @keyframes glowFloat {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.5; }
            100% { transform: translate(-60px, -40px) scale(1.3); opacity: 1; }
        }

        .hero {
            max-width: 820px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 3.5rem 2rem;
            background: rgba(11, 13, 21, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 3rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .number {
            font-size: clamp(5rem, 20vw, 11rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #ffffff 20%, #7aa9ff 60%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(122, 169, 255, 0.15);
            margin-bottom: 0.2rem;
        }

        .labs {
            font-size: clamp(2.2rem, 7vw, 4.4rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            margin-top: -0.3rem;
            margin-bottom: 1.8rem;
            text-shadow: 0 0 30px rgba(122, 169, 255, 0.1);
        }

        .tagline {
            font-size: clamp(1rem, 2.2vw, 1.5rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.08em;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 2rem;
            margin-bottom: 0;
        }

        .tagline span {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 400;
        }

        .signature {
            margin-top: 2.5rem;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.06);
            letter-spacing: 0.3em;
            font-weight: 300;
        }

        @media (max-width: 480px) {
            .hero { padding: 2rem 1.2rem; border-radius: 2rem; }
            .tagline { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="number">61</div>
        <div class="labs">Labs</div>
        <p class="tagline">
            <span>Dijitalin</span> sınırında, <span>bir sonraki</span> seviye.
        </p>
        <div class="signature">✦ 61° innovation ✦</div>
    </div>
</body>
</html>
